<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BizBuddy — open the app</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    background:radial-gradient(circle at 50% 35%,#1b1305,#0a0a0c 60%,#050506);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#fff; }
  .card { text-align:center; padding:38px 34px; border-radius:24px;
    background:rgba(255,255,255,.03); border:1px solid rgba(251,191,36,.22);
    box-shadow:0 22px 70px rgba(0,0,0,.55); max-width:min(90vw,430px); }
  h1 { margin:0 0 6px; font-size:26px; letter-spacing:-.03em; }
  h1 span { background:linear-gradient(90deg,#FB923C,#FDE047,#FB923C);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin:0 0 22px; font-size:13px; line-height:1.6; color:#a1a1aa; }
  a.btn { display:inline-block; padding:13px 26px; border-radius:14px; text-decoration:none;
    font-weight:700; font-size:14px; color:#1a1206;
    background:linear-gradient(90deg,#F97316,#FBBF24);
    box-shadow:0 12px 34px rgba(249,115,22,.42); }
  a.btn:hover { filter:brightness(1.07); }
  .note { margin-top:16px; font-size:11px; color:#71717a; }
</style>
</head>
<body>
  <div class="card">
    <h1>Biz<span>Buddy</span></h1>
    <p>Spatial GST OS — logo animation, real accounts &amp; saved workspaces.</p>
    <a class="btn" href="bizbuddy.html">Open the app →</a>
    <div class="note">First load plays the opening animation (~2s).</div>
  </div>
</body>
</html>
