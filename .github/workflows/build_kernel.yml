name: Build Begonia 4.14.186 Kaeru Driver Loader Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: begonia_user_defconfig
  DEVICE: begonia
  KBUILD_BUILD_USER: DRKMUQEETT
  KBUILD_BUILD_HOST: begonia
  KERNEL_REPO: https://github.com/Saikrishna1504/kernel_xiaomi_mt6785
  KERNEL_BRANCH: kaeru
  CLANG_REPO: https://github.com/kdrag0n/proton-clang
  CLANG_BRANCH: master

jobs:
  build:
    name: Build 4.14.186-driver-loader (Android 16 Base)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             bc bison build-essential ccache cpio curl device-tree-compiler             flex git kmod libelf-dev libssl-dev lz4 python3 rsync zip zstd gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python

      - name: Fetch Kaeru Android 16 Kernel Source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Patch Version to 4.14.186 & Localversion to -driver-loader
        working-directory: kernel
        run: |
          # Set exact kernel sublevel 186
          sed -i 's/SUBLEVEL = .*/SUBLEVEL = 186/' Makefile
          sed -i 's/EXTRAVERSION = .*/EXTRAVERSION = /' Makefile
          
          # Clean broken duplicate/incompatible LLVM Polly flags
          sed -i '/polly/d' Makefile
          sed -i '/unroll-threshold/d' Makefile

          head -n 5 Makefile

      - name: Patch SPM DRAM Golden Setting Check to prevent kernel panic
        working-directory: kernel
        run: |
          sed -i 's/r = -EPERM;/r = 0;/' drivers/misc/mediatek/base/power/spm/mt6785/mtk_spm_dram.c || true
          sed -i 's/aee_kernel_warning("SPM Warning"/printk("[SPM Warning]"/' drivers/misc/mediatek/base/power/spm/mt6785/mtk_spm_dram.c || true
          echo "Neutralized SPM DRAM check successfully!"

      - name: Fetch Proton-Clang toolchain
        run: |
          git clone --depth=1 -b "$CLANG_BRANCH" "$CLANG_REPO" "$HOME/proton-clang"
          echo "CLANG_DIR=$HOME/proton-clang" >> "$GITHUB_ENV"

      - name: Fix Clang Prefix and Assembler
        working-directory: kernel
        run: |
          sed -i 's|CLANG_FLAGS	+= --prefix=$(GCC_TOOLCHAIN_DIR)|CLANG_FLAGS	+= --prefix=$(GCC_TOOLCHAIN_DIR)$(notdir $(CROSS_COMPILE))|' Makefile || true

      - name: Inject Built-in Driver Loader (/dev/BYNb ioctl 0x803)
        run: |
          cp driver_loader_builtin.c kernel/drivers/misc/
          if ! grep -q "driver_loader_builtin.o" kernel/drivers/misc/Makefile; then
            echo "obj-y += driver_loader_builtin.o" >> kernel/drivers/misc/Makefile
          fi

      - name: Configure Defconfig for FolkPatch & Driver Loader
        working-directory: kernel
        run: |
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-driver-loader"/' arch/arm64/configs/begonia_user_defconfig || true
          if ! grep -q "CONFIG_LOCALVERSION=" arch/arm64/configs/begonia_user_defconfig; then
            echo 'CONFIG_LOCALVERSION="-driver-loader"' >> arch/arm64/configs/begonia_user_defconfig
          fi

          # Disable stack protector check failure
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/' arch/arm64/configs/begonia_user_defconfig || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_AUTO=y/# CONFIG_CC_STACKPROTECTOR_AUTO is not set/' arch/arm64/configs/begonia_user_defconfig || true

          cat << 'DEFCONFIG_EOF' >> arch/arm64/configs/begonia_user_defconfig
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_KALLSYMS_BASE_RELATIVE=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_OVERLAY_FS_REDIRECT_DIR=y
          CONFIG_OVERLAY_FS_INDEX=y
          CONFIG_DEBUG_LIST=y
          DEFCONFIG_EOF

      - name: Compile Real 4.14.186 Kernel
        working-directory: kernel
        run: |
          export PATH="$PATH:$CLANG_DIR/bin"
          
          make -j$(nproc --all) O=out ARCH=arm64             CC="$CLANG_DIR/bin/clang"             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_ARM32=arm-linux-gnueabi-             HOSTCC=gcc             HOSTLD=ld             "$DEFCONFIG"

          make -j$(nproc --all) O=out ARCH=arm64             CC="$CLANG_DIR/bin/clang"             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE=aarch64-linux-gnu-             CROSS_COMPILE_ARM32=arm-linux-gnueabi-             HOSTCC=gcc             HOSTLD=ld             Image.gz

          echo "Kernel compiled successfully!"

      - name: Package Verified Begonia AnyKernel3 ZIP (Header v2 clean)
        run: |
          git clone --depth=1 -b begonia https://github.com/cvnertnc/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md

          # Copy clean Image.gz (compatible with Header v2 boot partition)
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          
          # Custom branding in anykernel.sh & support Android 16
          sed -i 's/kernel.string=.*/kernel.string=Begonia 4.14.186-driver-loader by @DRKMUQEETT/' AnyKernel3/anykernel.sh
          sed -i 's/supported.versions=.*/supported.versions=/' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/Begonia-4.14.186-driver-loader-DRKMUQEETT.zip" . -x '.*'
          unzip -l "$GITHUB_WORKSPACE/Begonia-4.14.186-driver-loader-DRKMUQEETT.zip"

      - name: Upload Flashable Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Begonia-4.14.186-driver-loader-DRKMUQEETT
          path: Begonia-4.14.186-driver-loader-DRKMUQEETT.zip
