name: Begonia Kernel Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build 4.14.186 Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Kernel Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Begonia-4.14.186-DriverLoader-FolkPatch
          path: Begonia-4.14.186-DriverLoader-FolkPatch.zip
